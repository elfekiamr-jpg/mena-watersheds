services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      # Basin 17 (Nile) is baked into the image at build time (see
      # Dockerfile); the other MENA megabasins download on first use.
      # This volume keeps those downloads from being wiped and re-fetched
      # every time the container restarts.
      - mena_data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
  mena_data:
